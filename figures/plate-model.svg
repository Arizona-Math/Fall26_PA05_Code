<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">Material layout and prescribed temperatures of the composite plate</title>
  <desc id="desc">A unit square has conductivity 1, except for a horizontal channel from y=0.42 to y=0.58 with conductivity 8 and a circular inclusion centered at (0.55,0.5) with radius 0.12 and conductivity 0.25. The circle replaces the channel where they overlap. All boundary temperatures are 1-x.</desc>
  <rect width="820" height="460" fill="white"/>
  <g font-family="sans-serif" fill="#172b3a">
    <text x="320" y="35" text-anchor="middle" font-size="19">Top: u(x,1) = 1 − x</text>
    <rect x="160" y="70" width="320" height="320" fill="#f3efe4"/>
    <rect x="160" y="204.4" width="320" height="51.2" fill="#e7b558"/>
    <circle cx="336" cy="230" r="38.4" fill="#97bfd4"/>
    <rect x="160" y="70" width="320" height="320" fill="none" stroke="#172b3a" stroke-width="2"/>
    <text x="80" y="216" text-anchor="middle" font-size="19">Left</text>
    <text x="80" y="242" text-anchor="middle" font-size="19">u = 1</text>
    <text x="520" y="216" text-anchor="middle" font-size="19">Right</text>
    <text x="520" y="242" text-anchor="middle" font-size="19">u = 0</text>
    <text x="320" y="438" text-anchor="middle" font-size="19">Bottom: u(x,0) = 1 − x</text>
    <g font-size="13" fill="#41576a">
      <text x="152" y="62" text-anchor="end">(0,1)</text>
      <text x="486" y="62">(1,1)</text>
      <text x="152" y="406" text-anchor="end">(0,0)</text>
      <text x="486" y="406">(1,0)</text>
    </g>
    <text x="582" y="99" font-size="18" font-weight="bold">Conductivity k</text>
    <rect x="583" y="125" width="20" height="20" fill="#f3efe4" stroke="#8b8e8b"/>
    <text x="615" y="141" font-size="16">Background: 1</text>
    <rect x="583" y="172" width="20" height="20" fill="#e7b558"/>
    <text x="615" y="188" font-size="16">Channel: 8</text>
    <rect x="583" y="219" width="20" height="20" fill="#97bfd4"/>
    <text x="615" y="235" font-size="16">Circle: 0.25</text>
    <text x="582" y="283" font-size="15">Circle center: (0.55, 0.5)</text>
    <text x="582" y="307" font-size="15">Circle radius: 0.12</text>
    <text x="582" y="349" font-size="15">No internal heat source</text>
    <text x="582" y="373" font-size="15">f = 0</text>
  </g>
</svg>
